<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CookieScope — Cookie Chain explorer</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main>
      <h1><svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="13" fill="#f0b429"/><circle cx="12" cy="12" r="2.2" fill="#14100b"/><circle cx="20" cy="11" r="1.7" fill="#14100b"/><circle cx="17" cy="18" r="2.4" fill="#14100b"/><circle cx="11" cy="20" r="1.6" fill="#14100b"/><circle cx="22" cy="19" r="1.4" fill="#14100b"/></svg> CookieScope</h1>
      <p>Wallet + asset explorer for <strong>Cookie Chain</strong>, powered by the public Cookiescan DAS API.</p>
      <form id="lookup">
        <input id="addr" type="text" spellcheck="false" placeholder="Paste a Cookie Chain wallet address…" />
        <button type="submit">Inspect</button>
        <button type="button" id="connect">Connect wallet</button>
        <button type="button" id="activity">Latest activity</button>
        <button type="button" id="viewtoggle">Gallery view</button>
        <button type="button" id="movers">Movers</button>
      </form>
      <form id="searchform" onsubmit="return false">
        <input id="q" type="text" spellcheck="false" placeholder="Filter by name, mint, or creator…" />
        <button type="button" id="searchbtn">Search</button>
      </form>
      <p id="status"></p>
      <section id="results"></section>
      <div id="modal" hidden></div>
      <div id="palette" hidden>
        <div class="palbox" role="dialog" aria-modal="true" aria-label="Quick jump">
          <input id="paladdr" type="text" spellcheck="false" placeholder="Jump to wallet… (empty = latest activity)" />
          <button id="palgo">Go</button>
          <small>⌘K / Ctrl-K toggles · Esc closes</small>
        </div>
      </div>
      <footer>Read-only · DAS JSON-RPC · no keys needed · <a href="https://github.com/gpt4omni/cookiescope">source</a></footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
